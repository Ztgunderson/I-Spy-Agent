[project]
name = "stegowatch"
version = "0.1.0"
description = "Can a calibrated decision model (Clef-flash) spot steganographic collusion in NARCBench-Stego table talk?"
requires-python = ">=3.11"
dependencies = [
    "dlsdk",
    "numpy>=2.2",
    "pandas>=2.2",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.8",
]

[dependency-groups]
test = ["pytest>=8.0"]

# LoRA fine-tuning of Clef-flash (stegowatch.clef_lora). Same pins as handyman's train group.
train = [
    "torch==2.12.0",
    "transformers==5.9.0",
    "peft==0.21.0",
    "accelerate==1.15.0",
    "safetensors",
    "bitsandbytes>=0.45; sys_platform == 'linux'",
]

[tool.uv]
# The SDK is the sibling folder, installed editable (same wiring as handyman).
sources = { dlsdk = { path = "../sdk", editable = true } }
package = false
default-groups = ["train"]
